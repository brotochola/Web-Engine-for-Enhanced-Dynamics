<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WeedJS Bundle Smoke Test</title>
  <style>
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #8f8;
      font: 13px/1.5 monospace;
      z-index: 1000;
      pointer-events: none;
      text-shadow: 0 1px 3px #000;
    }
  </style>
</head>
<body>
  <div id="info">WeedJS Bundle Smoke Test — Loading...</div>

  <!--
    Entity definitions as inert text (not executed directly).
    Workers fetch this via Blob URL; main thread imports it dynamically.
    Mirrors demos/ballsScene/gameObjects/ball.js + floor.js for the BallsScene smoke.
  -->
  <script type="text/plain" id="entity-source">
const { GameObject, Keyboard, Mouse, RigidBody, Collider, SpriteRenderer, rng, enums } = WEED;
const { ShapeType } = enums;

export class Ball extends GameObject {
  static instances = [];
  static components = [RigidBody, Collider, SpriteRenderer];

  setup() {}

  onSpawned(spawnConfig = {}) {
    this.rigidBody.linearDamping = 0.2;

    this.rotation = 0;
    this.rigidBody.ax = 0;
    this.rigidBody.ay = 0;

    this.spriteRenderer.anchorX = 0.5;
    this.spriteRenderer.anchorY = 0.5;
    this.setAlpha(1.0);

    this.setSprite('_whiteCircle');

    const actualBallSize = 8; // built-in _whiteCircle is 8x8
    const ballRadius = spawnConfig.radius || rng() * 20 + 10;
    this.collider.radius = ballRadius;
    this.collider.visualRange = spawnConfig.visualRange || ballRadius * 3;

    const scale = (ballRadius * 2) / actualBallSize;
    this.spriteRenderer.scaleX = scale;
    this.spriteRenderer.scaleY = scale;

    const colors = [
      0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa29bfe,
      0x95e1d3, 0xfeca57, 0x48dbfb, 0xff9ff3,
    ];
    this.myColor = colors[Math.floor(rng() * colors.length)];
    this.setTint(this.myColor);
  }

  onDespawned() {}

  tick(dtRatio) {
    if (this.y > this.config.worldHeight * 2) {
      this.despawn();
      return;
    }

    if (Mouse.isButton1Down) {
      const dx = this.x - Mouse.x;
      const dy = this.y - Mouse.y;
      const dist2 = dx * dx + dy * dy;
      if (dist2 > 300000) return;
      this.addAcceleration(3600000 * (dx / dist2), 3600000 * (dy / dist2));
    }

    if (Keyboard.m) {
      this.rigidBody.ax = -10800;
    }
  }
}

export class Floor extends GameObject {
  static instances = [];
  static components = [RigidBody, Collider, SpriteRenderer];

  setup() {
    this.rigidBody.static = 1;
    this.collider.shapeType = ShapeType.Box;
    this.spriteRenderer.active = 1;
    this.collider.visualRange = 0;
  }

  onSpawned(spawnConfig = {}) {
    const config = spawnConfig || {};
    this.rigidBody.static = 1;

    const width = config.width || 100;
    const height = config.height || 100;

    this.collider.width = width;
    this.collider.height = height;
    this.collider.radius = 0;
    this.collider.friction = 0.6;

    const halfDiagonal = Math.hypot(width, height) / 2;
    this.collider.visualRange = halfDiagonal + 200;

    this.setSprite('_white');
    this.setScale(width / 8, height / 8);
    this.setAnchor(0.5, 0.5);
    this.setTint(0x666666);
    this.setAlpha(0.8);
  }

  tick(dtRatio) {}
}
  </script>

  <script type="module">
    const BUNDLES = new Set([
      'weed.bundle.min.js',
      'weed.bundle.esm.min.js',
      'weed.prod.bundle.min.js',
      'weed.prod.bundle.esm.min.js',
      'weed.bundle.compressed.min.js',
      'weed.bundle.esm.compressed.min.js',
      'weed.prod.bundle.compressed.min.js',
      'weed.prod.bundle.esm.compressed.min.js',
    ]);
    const params = new URLSearchParams(location.search);
    const requested = params.get('bundle') || 'weed.bundle.min.js';
    const bundle = BUNDLES.has(requested) ? requested : 'weed.bundle.min.js';
    const fixedFps = Math.max(0, Number(params.get('fixedFps')) || 0);
    const box2dWorkers = Math.max(0, Number(params.get('box2dWorkers')) || 0);
    const ticksParam = Math.max(0, Number(params.get('ticks')) || 0);
    const secondsParam = Math.max(0, Number(params.get('seconds')) || 0);
    const ballCount = Math.max(1, Number(params.get('balls')) || 9000);
    const manualStep = params.get('manualStep') === '1' || params.get('manualStep') === 'true';
    const visualLock = fixedFps > 0 || ticksParam > 0 || secondsParam > 0 || manualStep;
    const targetTicks = ticksParam > 0
      ? ticksParam
      : (secondsParam > 0 && fixedFps > 0 ? Math.round(secondsParam * fixedFps) : 0);

    async function loadWeed(file) {
      if (file.includes('.esm.')) {
        const mod = await import('./' + file);
        window.WEED = mod.default;
        return;
      }
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = file;
        s.onload = resolve;
        s.onerror = () => reject(new Error('failed to load ' + file));
        document.head.appendChild(s);
      });
    }

    await loadWeed(bundle);
    const WEED = window.WEED;
    if (!WEED) {
      throw new Error('WEED missing after loading ' + bundle);
    }
    if (typeof WEED.ensureEmbeddedSources === 'function') {
      await WEED.ensureEmbeddedSources();
    }

    const { GameEngine, Scene, Camera, Mouse } = WEED;

    // Create a fetchable Blob URL from the inline entity source.
    // Main thread imports it as a module; workers fetch() the same URL.
    const entitySource = document.getElementById('entity-source').textContent;
    const entityBlobUrl = URL.createObjectURL(
      new Blob([entitySource], { type: 'application/javascript' })
    );

    const { Ball, Floor } = await import(entityBlobUrl);
    Ball.scriptUrl = entityBlobUrl;
    Floor.scriptUrl = entityBlobUrl;

    const FRAME_RATE_STRIDE = 16;
    const FRAME_RATE_FRAME_SLOT = 1;

    function applyFixedFps(section) {
      if (fixedFps <= 0) return { ...section };
      return { ...section, fixedFps, noLimitFPS: false };
    }

    // Mirrors demos/ballsScene/ballsScene.js
    class TestScene extends Scene {
      static config = {
        worldWidth: 4000,
        worldHeight: 5000,
        seed: 123456,
        manualStep,
        spatial: applyFixedFps({
          numberOfSpatialWorkers: 1,
          cellSize: 100,
          maxNeighbors: 512,
          noLimitFPS: false,
        }),
        logic: applyFixedFps({ noLimitFPS: false }),
        particle: applyFixedFps({
          noLimitFPS: false,
          maxParticles: 0,
          decals: false,
          decalsTileSize: 256,
          decalsResolution: 0.5,
        }),
        physics: applyFixedFps({
          box2dWorkerCount: box2dWorkers > 0 ? box2dWorkers : 4,
          subStepCount: 4,
          noLimitFPS: false,
          gravity: { x: 0, y: 1800 },
          sleepThreshold: 30,
          wakeUpThreshold: 30,
          sleepDuration: 10,
          ...(manualStep ? { sleeping: false } : {}),
        }),
        preRender: applyFixedFps({
          noLimitFPS: false,
          interpolation: { mode: 'off' },
        }),
        renderer: applyFixedFps({
          noLimitFPS: false,
          backend: 'webgl',
          ...(manualStep ? { ySorting: false } : {}),
        }),
        lighting: { enabled: false },
        debug: { collectDetailedStats: true },
      };

      static entities = [
        [Ball, Math.max(10000, ballCount + 100)],
        [Floor, 1000],
      ];

      constructor(game) {
        super(game);
        this.cameraPanSpeed = 10;
        this.cameraFollowX = 0;
        this.cameraFollowY = 0;
      }

      create() {
        this.spawnFloorAndWalls();
        this.spawnBalls(ballCount);

        this.cameraFollowX = this.config.worldWidth / 2;
        this.cameraFollowY = this.config.worldHeight / 2;
        if (visualLock) {
          Camera.setZoom(0.15);
          document.getElementById('info').style.display = 'none';
        }
        Camera.centerOn(this.cameraFollowX, this.cameraFollowY);

        document.getElementById('info').innerHTML =
          'WeedJS Bundle Test &#10004;<br>' +
          ballCount + ' balls &mdash; click to push, scroll to zoom, WASD to pan';
      }

      update(dtRatio) {
        if (visualLock) return;

        const panSpeed = this.cameraPanSpeed / Camera.zoom;
        const kb = this.keyboard;

        if (kb.w || kb.arrowup) this.cameraFollowY -= panSpeed;
        if (kb.s || kb.arrowdown) this.cameraFollowY += panSpeed;
        if (kb.a || kb.arrowleft) this.cameraFollowX -= panSpeed;
        if (kb.d || kb.arrowright) this.cameraFollowX += panSpeed;

        this.cameraFollowX = Math.max(0, Math.min(this.cameraFollowX, this.config.worldWidth));
        this.cameraFollowY = Math.max(0, Math.min(this.cameraFollowY, this.config.worldHeight));

        Camera.follow(this.cameraFollowX, this.cameraFollowY, 0.15);
        Camera.setZoom(Camera.zoom * (1 - Mouse.wheel * 0.1));
      }

      spawnFloorAndWalls() {
        const wallThickness = 1000;
        const worldWidth = this.config.worldWidth;
        const worldHeight = this.config.worldHeight;

        this.spawnEntity(Floor, {
          x: worldWidth / 2,
          y: worldHeight + wallThickness * 0.5 - 50,
          width: worldWidth,
          height: wallThickness,
        });
        this.spawnEntity(Floor, {
          x: worldWidth / 2,
          y: -wallThickness / 2,
          width: worldWidth,
          height: wallThickness,
        });
        this.spawnEntity(Floor, {
          x: -wallThickness / 2 + 50,
          y: worldHeight / 2,
          width: wallThickness,
          height: worldHeight,
        });
        this.spawnEntity(Floor, {
          x: worldWidth + wallThickness / 2 - 50,
          y: worldHeight / 2,
          width: wallThickness,
          height: worldHeight,
        });
      }

      spawnBalls(count) {
        const worldWidth = this.config.worldWidth;
        const worldHeight = this.config.worldHeight;
        for (let i = 0; i < count; i++) {
          this.spawnEntity(Ball, {
            x: 0.2 * worldWidth + this.rng() * worldWidth * 0.6,
            y: 0.2 * worldHeight + this.rng() * worldHeight * 0.6,
            vx: 0,
            vy: 0,
          });
        }
      }
    }

    const game = new GameEngine({
      autoResize: !visualLock,
      canvasWidth: visualLock ? 1280 : undefined,
      canvasHeight: visualLock ? 720 : undefined,
      debug: !visualLock,
    });
    window.game = game;
    await game.loadScene(TestScene);

    const spatialCount = TestScene.config.spatial.numberOfSpatialWorkers || 1;
    const physicsIndex = spatialCount;
    const rendererIndex = spatialCount + 1;

    function readWorkerFrame(index) {
      const view = game.currentScene?.views?.frameRate;
      if (!view) return 0;
      return view[index * FRAME_RATE_STRIDE + FRAME_RATE_FRAME_SLOT] | 0;
    }

    function readActiveEntities() {
      const data = WEED.GameObject?.activeEntitiesData;
      return data ? data[0] | 0 : 0;
    }

    function readVisibleSprites() {
      const sab = game.currentScene?.buffers?.rendererStats;
      if (!sab) return 0;
      return new Float32Array(sab)[2] | 0;
    }

    window.__weedVisual = {
      tick: 0,
      physicsFrame: 0,
      pixiFrame: 0,
      visibleSprites: 0,
      activeEntities: 0,
      ready: false,
      targetTicks,
      visualLock,
    };

    const pump = () => {
      const physicsFrame = readWorkerFrame(physicsIndex);
      const pixiFrame = readWorkerFrame(rendererIndex);
      const visibleSprites = readVisibleSprites();
      const activeEntities = readActiveEntities();
      const tick = physicsFrame;
      const ready =
        physicsFrame >= 1 &&
        pixiFrame >= 1 &&
        (!visualLock || visibleSprites > 10);
      window.__weedVisual.tick = tick;
      window.__weedVisual.physicsFrame = physicsFrame;
      window.__weedVisual.pixiFrame = pixiFrame;
      window.__weedVisual.visibleSprites = visibleSprites;
      window.__weedVisual.activeEntities = activeEntities;
      window.__weedVisual.ready = ready;
      requestAnimationFrame(pump);
    };
    requestAnimationFrame(pump);

    window.__weedLockstep = {
      ready: true,
      manualStep,
      expectedActive: ballCount + 4,
      countActive() {
        const a = WEED.Transform?.active;
        if (!a) return 0;
        let n = 0;
        for (let i = 0; i < a.length; i++) if (a[i]) n++;
        return n;
      },
      hash() {
        return game.currentScene.hashActiveTransforms();
      },
      stepFrames(n, dt) {
        return game.currentScene.stepFrames(n, dt);
      },
    };
  </script>
</body>
</html>
