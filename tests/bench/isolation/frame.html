<!doctype html>
<html>
<head><meta charset="utf-8"><title>Isolation smoke frame</title></head>
<body style="margin:0;background:#222">
<!-- DX-SW, SW-4: a page that embeds the game from ?src=; ?allow= sets the frame's allow attribute
     (cross-origin-isolated, for a parent that is isolated itself). -->
<iframe id="game" style="width:640px;height:360px;border:0"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const frame = document.getElementById('game');
  if (q.has('allow')) frame.allow = q.get('allow');
  frame.src = q.get('src');
</script>
</body>
</html>
