<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Isolation smoke</title>
<style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
<script>
  // A browser started without Playwright (isolationWorkerSmoke.mjs --browser firefox) takes the test's calls through
  // stockDriver.js; each document says it loaded, so the test counts loads from the console.
  if (new URLSearchParams(location.search).has('stockDriver')) {
    document.write('<script src="../stockDriver.js"><\/script>');
  }
</script>
<script>console.log('[smoke] load', self.crossOriginIsolated === true);</script>
<script type="module">
// DX-SW, SW-4. A game page as a host without COOP/COEP serves it: the engine from source, the
// isolation service worker at the URL in ?sw= (the engine's default without it; "off" turns it off), the scene
// in ?scene=. window.__smoke says how far it got; isolationWorkerSmoke.mjs reads it.
const q = new URLSearchParams(location.search);
window.__smoke = { state: 'loading', isolated: self.crossOriginIsolated === true, error: null };
try {
  const { default: WEED } = await import('/src/index.js');
  // No ?sw=: the engine's own default (from source, /weed-sw.js at the site root).
  const sw = q.get('sw');
  const config = { autoResize: true };
  if (sw !== null) config.isolationServiceWorker = sw === 'off' ? false : sw;
  const game = new WEED.GameEngine(config);
  window.__smoke.game = game;
  // The game's own UI, drawn from script as a menu would be. White, so a flash of it before the
  // first visit's reload shows in a screenshot; gone once the scene runs, so "drawn" is the canvas.
  const ui = document.createElement('div');
  ui.id = 'smoke-ui';
  ui.textContent = 'MENU';
  ui.style.cssText = 'position:fixed;left:20px;top:20px;width:240px;height:120px;background:#fff;z-index:1000';
  document.body.appendChild(ui);
  await game.loadScene(q.get('scene') || '/demos/orientedBoxScene/orientedBoxScene.js');
  ui.remove();
  window.__smoke.state = 'running';
} catch (err) {
  window.__smoke.state = 'failed';
  window.__smoke.error = String((err && err.message) || err);
}
</script>
</body>
</html>
