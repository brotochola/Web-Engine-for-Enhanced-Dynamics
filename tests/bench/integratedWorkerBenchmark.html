<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Integrated Worker Benchmark</title>
  <script>
    // Default: shipped bundle (the debug ESM one, or ?weedBundle=<dist ESM bundle>). ?src=1 loads /src modules +
    // /src/workers (uncommitted engine).
    if (!new URLSearchParams(location.search).has('src')) {
      const named = new URLSearchParams(location.search).get('weedBundle') || '';
      const bundle = /^weed(\.prod)?\.bundle\.esm(\.compressed)?\.min\.js$/.test(named) ? named : 'weed.bundle.esm.min.js';
      document.write('<script type="importmap">{"imports":{"/src/index.js":"/dist/' + bundle + '"}}<\/script>');
    }
    // A browser started without Playwright (stockFirefox.mjs) takes the runner's calls through stockDriver.js.
    if (new URLSearchParams(location.search).has('stockDriver')) {
      document.write('<script src="stockDriver.js"><\/script>');
    }
  </script>
</head>
<body>
  <script type="module">
    class BenchmarkAudioContext {
      constructor() {
        this.state = 'running';
        this.destination = {};
        this.audioWorklet = {
          addModule: async () => {},
        };
      }

      resume() {
        this.state = 'running';
        return Promise.resolve();
      }

      close() {
        this.state = 'closed';
        return Promise.resolve();
      }

      decodeAudioData() {
        const silence = new Float32Array(1);
        return Promise.resolve({
          numberOfChannels: 1,
          length: silence.length,
          getChannelData: () => silence,
        });
      }
    }

    class BenchmarkAudioWorkletNode {
      constructor() {
        this.port = {
          postMessage() {},
        };
      }

      connect() {
        return this;
      }

      disconnect() {}
    }

    globalThis.AudioContext = BenchmarkAudioContext;
    globalThis.AudioWorkletNode = BenchmarkAudioWorkletNode;

    /** Align with `demos/index.html` typical viewport when opened via the bench runner. */
    const DEFAULT_CANVAS_WIDTH = 1920;
    const DEFAULT_CANVAS_HEIGHT = 1080;

    /* Keep in sync with tests/bench/benchmarkDefaults.mjs */
    const DEFAULT_CONFIG = Object.freeze({
      warmupMs: 25000,
      durationMs: 18000,
      sampleIntervalMs: 100,
      canvasWidth: DEFAULT_CANVAS_WIDTH,
      canvasHeight: DEFAULT_CANVAS_HEIGHT,
      sceneModule: '/demos/ballsScene/ballsScene.js',
      sceneExport: 'BallsScene',
    });

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function normalizePositiveInteger(value, fallback) {
      const normalized = Number(value);
      return Number.isFinite(normalized) && normalized > 0 ? Math.round(normalized) : fallback;
    }

    function normalizeConfig(options = {}) {
      const canvasWidth = normalizePositiveInteger(options.canvasWidth, DEFAULT_CONFIG.canvasWidth);
      const canvasHeight = normalizePositiveInteger(options.canvasHeight, DEFAULT_CONFIG.canvasHeight);

      return {
        warmupMs: normalizePositiveInteger(options.warmupMs, DEFAULT_CONFIG.warmupMs),
        durationMs: normalizePositiveInteger(options.durationMs, DEFAULT_CONFIG.durationMs),
        sampleIntervalMs: normalizePositiveInteger(
          options.sampleIntervalMs,
          DEFAULT_CONFIG.sampleIntervalMs
        ),
        canvasWidth,
        canvasHeight,
        worldWidth: normalizePositiveInteger(options.worldWidth, canvasWidth),
        worldHeight: normalizePositiveInteger(options.worldHeight, canvasHeight),
        sceneModule: options.sceneModule || DEFAULT_CONFIG.sceneModule,
        sceneExport: options.sceneExport || DEFAULT_CONFIG.sceneExport,
        // Match demos/index.html: DebugUI on; attach() still disableAll() visual overlays.
        debug: Boolean(options.debug),
        // Benches default true so VISIBILITY_MS / BOX2D_MS etc. stay populated.
        collectDetailedStats:
          options.collectDetailedStats === undefined
            ? true
            : Boolean(options.collectDetailedStats),
        collectGpuStats: Boolean(options.collectGpuStats),
        // --camera-zoom: min (Camera.minZoom) or a zoom, set once the scene has been created.
        cameraZoom: options.cameraZoom === 'min' || Number(options.cameraZoom) > 0 ? options.cameraZoom : null,
      };
    }

    let currentGame = null;
    /** @type {null | {
     *   config: ReturnType<typeof normalizeConfig>,
     *   SceneClass: Function,
     *   reader: { snapshot: (t: number) => unknown },
     *   summarizeWorkerBenchmarkWindow: Function,
     *   startSnapshot: unknown,
     *   sampleSnapshots: unknown[],
     *   sampleTimer: ReturnType<typeof setInterval> | null,
     * }} */
    let session = null;

    async function cleanupCurrentGame() {
      if (!currentGame) return;
      await currentGame.destroy();
      currentGame = null;
    }

    function stopSampling() {
      if (!session?.sampleTimer) return;
      clearInterval(session.sampleTimer);
      session.sampleTimer = null;
    }

    async function loadModules(sceneModule, sceneExport) {
      const [{ default: WEED }, sceneModuleExports, benchmarkMetrics] = await Promise.all([
        import('/src/index.js'),
        import(sceneModule),
        import('/tests/bench/workerBenchmarkMetrics.js'),
      ]);
      // In-page half of the distVersion guard. Without ?src=1 the importmap above
      // resolves /src/index.js to the committed dist/ bundle, which can be an
      // older engine than the tree the harness is reading schemas from. This
      // compares the version the engine actually reports against src/version.js.
      // Node-side scripts/distVersion.js blocks most entry points earlier; this
      // covers the ones that navigate straight to this page.
      if (!new URLSearchParams(location.search).get('src')) {
        try {
          const { VERSION: srcVersion } = await import('/src/version.js');
          const loaded = WEED && WEED.VERSION;
          if (loaded && srcVersion && loaded !== srcVersion) {
            throw new Error(
              `Engine version mismatch: the page loaded ${loaded} (dist bundle) but ` +
              `src/version.js is ${srcVersion}. This run would measure ${loaded}, not ` +
              `the working tree. Reload with ?src=1, or run: npm run make_bundle`,
            );
          }
        } catch (err) {
          if (err && /Engine version mismatch/.test(err.message)) throw err;
          // /src/version.js unreachable (static server without src mounted):
          // nothing to compare, let the run proceed.
        }
      }
      if (typeof WEED.ensureEmbeddedSources === 'function') {
        await WEED.ensureEmbeddedSources();
      }
      const SceneClass = sceneModuleExports[sceneExport];
      if (!SceneClass) {
        throw new Error(`Benchmark scene export "${sceneExport}" not found in ${sceneModule}`);
      }

      return {
        WEED,
        SceneClass,
        createWorkerBenchmarkReader: benchmarkMetrics.createWorkerBenchmarkReader,
        summarizeWorkerBenchmarkWindow: benchmarkMetrics.summarizeWorkerBenchmarkWindow,
      };
    }

    /** The engine's fatal error overlay as one line of text, or null when there is none. */
    function fatalErrorText() {
      const overlay = document.getElementById('fatal-error-overlay');
      return overlay ? overlay.textContent.replace(/\s+/g, ' ').trim() : null;
    }

    /**
     * The physics pose buffers as the engine publishes them, read where the scene keeps them (Phase 4: regions of
     * Box2D's block): active bodies, how many have a live pose in the current generation, and the largest
     * distance between that pose and Transform's. Null without physics.
     */
    function publishedPoseCheck(scene) {
      const b = scene.buffers;
      const n = b.poseCapacity | 0;
      const rb = globalThis.RigidBody?.active;
      const tx = globalThis.Transform?.x;
      const ty = globalThis.Transform?.y;
      if (!scene._physicsEnabled || !b.poseSync || !(n > 0) || !rb || !tx) return null;
      const ready = Atomics.load(new Int32Array(b.poseSync), 0);
      if (!(ready > 0)) return { bodies: 0, live: 0, maxDelta: null, ready };
      const cur = (ready - 1) & 1;
      const sab = cur ? b.poseDataB : b.poseDataA;
      const at = (cur ? b.poseDataBByte : b.poseDataAByte) | 0;
      const px = new Float32Array(sab, at, n);
      const py = new Float32Array(sab, at + n * 4, n);
      const rc = new Float32Array(sab, at + n * 8, n);
      const rs = new Float32Array(sab, at + n * 12, n);
      let bodies = 0;
      let live = 0;
      let maxDelta = 0;
      for (let i = 0; i < n && i < rb.length; i++) {
        if (!rb[i]) continue;
        bodies++;
        if (rc[i] * rc[i] + rs[i] * rs[i] <= 0.25) continue;
        live++;
        const dx = px[i] - tx[i];
        const dy = py[i] - ty[i];
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > maxDelta) maxDelta = d;
      }
      return { bodies, live, maxDelta, ready };
    }

    /** How many entities have at least one neighbour in the rows spatial publishes, of how many; null without. */
    function neighborRowsCheck(scene) {
      const b = scene.buffers;
      const meta = scene.gridMetadata;
      const n = scene.totalEntityCount | 0;
      if (!b.neighborData || !meta || !(n > 0)) return null;
      const stride = 1 + (meta.maxNeighbors | 0);
      const Ids = meta.entityIdBytes === 4 ? Uint32Array : Uint16Array;
      const rows = new Ids(b.neighborData, meta.neighborByte | 0, n * stride);
      let withNeighbors = 0;
      for (let i = 0; i < n; i++) if (rows[i * stride] > 0) withNeighbors++;
      return { entities: n, withNeighbors };
    }

    function summarizeFromSession(
      startSnapshot,
      endSnapshot,
      sampleSnapshots,
      config,
      SceneClass,
      scene
    ) {
      const summary = session.summarizeWorkerBenchmarkWindow(startSnapshot, endSnapshot, {
        measurementDurationMs: endSnapshot.takenAtMs - startSnapshot.takenAtMs,
        sampleSnapshots,
        totalsWindow: session.reader.totalsWindow,
      });

      return {
        ...summary,
        metadata: {
          benchmark: 'integrated-worker-benchmark',
          sceneName: SceneClass.name || config.sceneExport,
          sceneModule: config.sceneModule,
          sceneExport: config.sceneExport,
          canvasWidth: config.canvasWidth,
          canvasHeight: config.canvasHeight,
          spatialWorkers: scene.config.spatial.numberOfSpatialWorkers,
          logicWorkers: scene.config.logic.numberOfLogicWorkers,
          // Which WASM kernels this run used (E-76 T7): the switches, and what actually ran.
          wasm: { ...(scene.config.wasm || {}) },
          physicsMemoryMB: scene.config.physics?.wasmMemoryMB ?? null,
          // The fatal overlay's text if a worker died during the run (null when none did).
          fatalError: fatalErrorText(),
          wasmRan: { spatialPublish: Boolean(scene.spatialPublish) },
          // Phase 4: the block of Box2D's memory the render-queue regions sit in, or null (separate memories).
          box2dBlock: scene.box2dBlock ? { byte: scene.box2dBlock.byte, bytes: scene.box2dBlock.bytes, inBlock: scene.renderQueueMemory?.memory === scene.box2dBlock.memory, bodies: (scene.renderQueueMemory?.layout.collect?.bodyPoseAByte ?? -1) >= 0, spatial: Boolean(scene.spatialPublish) && scene.spatialPublish.memory === scene.box2dBlock.memory } : null,
          // The published poses read back where they live: a body whose pose never lands reads as not live.
          publishedPose: publishedPoseCheck(scene),
          // Entities with a published neighbour row (spatial's output, where logic reads it).
          neighborRows: neighborRowsCheck(scene),
          worldWidth: config.worldWidth,
          worldHeight: config.worldHeight,
          warmupMs: config.warmupMs,
          durationMs: config.durationMs,
          sampleIntervalMs: config.sampleIntervalMs,
          sampleCount: sampleSnapshots.length,
          // Every frame in the window counted (src/util/frameTotals.js), or only the samples.
          exactWindow: Boolean(session.reader.totalsWindow),
        },
      };
    }

    /**
     * Boot scene and start the game loop. Runner controls warmup/measure pacing.
     */
    async function prepareIntegratedWorkerBenchmark(options = {}) {
      stopSampling();
      session = null;

      const config = normalizeConfig(options);
      const {
        WEED,
        SceneClass,
        createWorkerBenchmarkReader,
        summarizeWorkerBenchmarkWindow,
      } = await loadModules(config.sceneModule, config.sceneExport);

      // ?wasmOff=spatialPublish[,…] runs those WASM kernels' JavaScript paths (E-76 T7).
      const wasmOff = (new URLSearchParams(location.search).get('wasmOff') || '').split(',').filter(Boolean);
      // ?physicsMemoryMB=N runs the scene with that physics.wasmMemoryMB (BOX2D_MEMORY_PLAN BM-10).
      const physicsMemoryMB = Number(new URLSearchParams(location.search).get('physicsMemoryMB')) || 0;

      // Override scene debug flags before Scene applies defaults / boots workers
      SceneClass.config = {
        ...SceneClass.config,
        debug: {
          ...(SceneClass.config.debug || {}),
          collectDetailedStats: config.collectDetailedStats,
          collectGpuStats: config.collectGpuStats,
        },
        ...(wasmOff.length
          ? { wasm: { ...(SceneClass.config.wasm || {}), ...Object.fromEntries(wasmOff.map((name) => [name, false])) } }
          : {}),
        ...(physicsMemoryMB > 0
          ? { physics: { ...(SceneClass.config.physics || {}), wasmMemoryMB: physicsMemoryMB } }
          : {}),
      };

      await cleanupCurrentGame();

      const game = new WEED.GameEngine({
        autoResize: false,
        canvasWidth: config.canvasWidth,
        canvasHeight: config.canvasHeight,
        injectStyles: false,
        preventContextMenu: false,
        preventDefaultKeys: false,
        debug: config.debug,
      });
      currentGame = game;

      // A worker that dies while booting never reports ready, and loadScene would wait forever.
      // Its error shows as the fatal overlay: end the run with that text instead.
      let fatalWatch = 0;
      const fatalDuringBoot = new Promise((_, reject) => {
        fatalWatch = setInterval(() => {
          const text = fatalErrorText();
          if (text) reject(new Error(`Fatal engine error while the scene booted: ${text}`));
        }, 100);
      });
      try {
        await Promise.race([game.loadScene(config.sceneModule, { export: config.sceneExport }), fatalDuringBoot]);
      } finally {
        clearInterval(fatalWatch);
      }
      const scene = game.currentScene;
      // loadScene resolves after the scene's create(), so this zoom stays.
      if (config.cameraZoom != null) {
        WEED.Camera.setZoom(config.cameraZoom === 'min' ? WEED.Camera.minZoom : Number(config.cameraZoom));
      }
      // The running totals, when this tree's engine keeps them (an older baseline does not).
      const frameTotals = scene.buffers?.frameTotals ? await import('/src/util/frameTotals.js') : null;
      const reader = createWorkerBenchmarkReader(scene, { frameTotals });

      session = {
        config,
        SceneClass,
        scene,
        reader,
        summarizeWorkerBenchmarkWindow,
        startSnapshot: null,
        sampleSnapshots: [],
        sampleTimer: null,
      };

      return {
        ok: true,
        warmupMs: config.warmupMs,
        durationMs: config.durationMs,
        sampleIntervalMs: config.sampleIntervalMs,
      };
    }

    /** Start measure window + periodic metric samples. */
    function beginMeasureIntegratedWorkerBenchmark() {
      if (!session) {
        throw new Error('Benchmark session not prepared');
      }
      stopSampling();
      session.startSnapshot = session.reader.snapshot(performance.now(), { totals: true });
      session.sampleSnapshots = [];
      session.sampleTimer = setInterval(() => {
        if (!session) return;
        session.sampleSnapshots.push(session.reader.snapshot(performance.now()));
      }, session.config.sampleIntervalMs);
      return { ok: true };
    }

    /** Stop sampling, summarize, destroy game. Same shape as legacy run(). */
    async function collectIntegratedWorkerBenchmark() {
      if (!session) {
        throw new Error('Benchmark session not prepared');
      }
      stopSampling();

      const endSnapshot = session.reader.snapshot(performance.now(), { totals: true });
      const startSnapshot = session.startSnapshot || endSnapshot;
      const result = summarizeFromSession(
        startSnapshot,
        endSnapshot,
        session.sampleSnapshots,
        session.config,
        session.SceneClass,
        session.scene
      );

      globalThis.__WEED_LAST_BENCHMARK__ = result;
      session = null;
      await cleanupCurrentGame();
      return result;
    }

    /** Legacy single-call API (no mid-run screenshots). */
    async function runIntegratedWorkerBenchmark(options = {}) {
      const prepared = await prepareIntegratedWorkerBenchmark(options);
      await sleep(prepared.warmupMs);
      beginMeasureIntegratedWorkerBenchmark();
      await sleep(prepared.durationMs);
      return collectIntegratedWorkerBenchmark();
    }

    globalThis.__WEED_BENCHMARK__ = {
      run: runIntegratedWorkerBenchmark,
      prepare: prepareIntegratedWorkerBenchmark,
      beginMeasure: beginMeasureIntegratedWorkerBenchmark,
      collect: collectIntegratedWorkerBenchmark,
      // Raw Scene instance (buffers, spawnEntity, ...) for callers that need
      // more than the summarized STEP_MS/Load% report, e.g. sampling a live
      // SharedArrayBuffer directly (poseInterpolationVerify.mjs).
      getScene: () => session?.scene ?? null,
    };

    document.body.dataset.benchmarkReady = 'true';
  </script>
</body>
</html>
