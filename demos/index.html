<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WeedJS Demos</title>
  <script>
    // Served below the site root (GitHub Pages: /Web-Engine-for-Enhanced-Dynamics/demos/), the engine's source cannot
    // run: its workers load from /src/. The demos import it as '/src/index.js'; there they get the debug bundle.
    if (!location.pathname.startsWith('/demos/')) {
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({
        imports: { '/src/index.js': new URL('../dist/weed.bundle.esm.min.js', location.href).href },
      });
      document.currentScript.after(map);
    }
  </script>
  <!-- Relative: on Pages the site's service worker, which serves the demos' '/demos/…' paths, may not be there yet. -->
  <link rel="stylesheet" href="menu.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <div id="scene_list"></div>
  <script type="module" src="menu.js"></script>
</body>
</html>
