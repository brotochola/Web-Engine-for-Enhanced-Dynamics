<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WeedJS Demos</title>
  <style>
    #scene_list {
      position: fixed;
      top: 50vh;
      left: 50vw;
      transform: translate(-50%, -50%);
      color: white;
      z-index: 1000;
    }

    .scene_chooser_button {
      margin: 10px;
      width: 250px;
      height: 40px;
      background: #000;
      color: white;
      border: 1px solid white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
  <link rel="icon" href="/demos/favicon.ico" />
</head>
<body>
  <div id="scene_list"></div>
  <script type="module">
    // Import WeedJS engine 🌿
    import WEED from '/src/index.js';
    import { PredatorScene } from '/demos/predatorScene/predatorScene.js';
    import { BallsScene } from '/demos/ballsScene/ballsScene.js';
    import { BallsAndRectanglesScene } from '/demos/ballsAndRectanglesScene/ballsAndRectanglesScene.js';
    import { BichosScene } from '/demos/bichosScene/bichosScene.js';
    import { BoidsScene } from '/demos/boidsScene/boidsScene.js';
    import { ConstraintsTestScene } from '/demos/constraintsTestScene/constraintsTestScene.js';
    import { CarScene } from '/demos/carScene/carScene.js';
    import { WaterAndBoxesScene } from '/demos/waterAndBoxesScene/waterAndBoxesScene.js';
    import { ZenithalParticleTestScene } from '/demos/zenithalParticleTestScene/zenithalParticleTestScene.js';
    import { ParticleLabScene } from '/demos/particleLabScene/particleLabScene.js';
    import { AdobeAnimateScene } from '/demos/adobeAnimateScene/adobeAnimateScene.js';
    import { PlatformerGameScene } from '/demos/platformerGameScene/platformerGameScene.js';
    import { ConstraintBoxScene } from '/demos/constraintBoxScene/constraintBoxScene.js';
    import { OrientedBoxScene } from '/demos/orientedBoxScene/orientedBoxScene.js';
    import { WeldBreakScene } from '/demos/weldBreakScene/weldBreakScene.js';
    import { Box2dQueryAabbScene } from '/demos/box2dQueryAabbScene/box2dQueryAabbScene.js';
    import { BadPiggiesScene } from '/demos/badPiggiesScene/badPiggiesScene.js';
    import { LiquidFunDemoScene } from '/demos/liquidFunDemoScene/liquidFunDemoScene.js';
    import { LiquidFunStressScene } from '/tests/bench/stressScenes/liquidFunStressScene.js';
    import { MamushkaDigScene } from '/demos/mamushkaDigScene/mamushkaDigScene.js';
    import { BurningBoxesScene } from '/demos/burningBoxesScene/burningBoxesScene.js';
    import { DestructibleTerrainScene } from '/demos/destructibleTerrainScene/destructibleTerrainScene.js';

    // Destructure what we need from WEED
    const { GameEngine } = WEED;

    // ========================================
    // GAME ENGINE SETUP
    // ========================================

    const game = new GameEngine({
      autoResize: true,
      debug: true,
    });
    // Make game global for console access
    window.game = game;
    const scenes = [
      { name: '🐺 Predators', class: PredatorScene },
      { name: '⚽ Balls', class: BallsScene },
      { name: '🔗 Constraints', class: ConstraintsTestScene },
      { name: '📦 Boxes', class: BallsAndRectanglesScene },
      { name: '🐜 Ants', class: BichosScene },
      { name: '🐦 Boids', class: BoidsScene },
      { name: '🚗 Car', class: CarScene },
      { name: '💧 Water & Boxes', class: WaterAndBoxesScene },
      { name: '🔬 Zenithal Particles', class: ZenithalParticleTestScene },
      { name: '✨ Particle Lab', class: ParticleLabScene },
      { name: '🦴 Adobe Animate', class: AdobeAnimateScene },
      { name: 'platformer game', class: PlatformerGameScene },
      { name: 'Constraint Boxes', class: ConstraintBoxScene },
      { name: 'Oriented Boxes', class: OrientedBoxScene },
      { name: 'Weld Break', class: WeldBreakScene },
      { name: 'Box2D QueryAABB', class: Box2dQueryAabbScene },
      { name: '🐷 Bad Piggies', class: BadPiggiesScene },
      { name: '🌊 LiquidFun Fluid', class: LiquidFunDemoScene },
      { name: '🧪 LiquidFun Stress (bench)', class: LiquidFunStressScene },
      { name: '🧱 Mamushka Dig', class: MamushkaDigScene },
      { name: '🔥 Burning Boxes', class: BurningBoxesScene },
      { name: '⛰️ Destructible Terrain', class: DestructibleTerrainScene },
    ]
    // Register available scenes with DebugUI for scene switching
    if (game.debugUI) {
      game.debugUI.registerScenes(scenes);
    }


    for (let i = 0; i < scenes.length; i++) {
      const scene = scenes[i];
      const button = document.createElement('button');
      button.className = 'scene_chooser_button';
      button.onclick = () => {
        game.loadScene(scene.class);
        document.getElementById('scene_list').style.display = 'none';
      }
      button.textContent = scene.name;
      document.getElementById('scene_list').appendChild(button);
      if (i % 2 == 1) document.getElementById('scene_list').appendChild(document.createElement('br'));
    }


    // Load the Predator scene by default
    // await game.loadScene(PredatorScene);

  </script>
</body>
</html>
