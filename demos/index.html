<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WeedJS Demos</title>
  <style>
    #scene_list {
      position: fixed;
      top: 50vh;
      left: 50vw;
      transform: translate(-50%, -50%);
      color: white;
      z-index: 1000;
    }

    .scene_chooser_button {
      margin: 10px;
      width: 250px;
      height: 40px;
      background: #000;
      color: white;
      border: 1px solid white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
  <link rel="icon" href="/demos/favicon.ico" />
</head>
<body>
  <div id="scene_list"></div>
  <script type="module">
    import WEED from '/src/index.js';

    const { GameEngine } = WEED;

    const game = new GameEngine({
      autoResize: true,
      debug: true,
    });
    window.game = game;

    const scenes = [
      { name: '🐺 Predators', load: () => import('/demos/predatorScene/predatorScene.js').then((m) => m.PredatorScene) },
      { name: '⚽ Balls', load: () => import('/demos/ballsScene/ballsScene.js').then((m) => m.BallsScene) },
      { name: '🔗 Constraints', load: () => import('/demos/constraintsTestScene/constraintsTestScene.js').then((m) => m.ConstraintsTestScene) },
      { name: '📦 Boxes', load: () => import('/demos/ballsAndRectanglesScene/ballsAndRectanglesScene.js').then((m) => m.BallsAndRectanglesScene) },
      { name: '🐜 Ants', load: () => import('/demos/bichosScene/bichosScene.js').then((m) => m.BichosScene) },
      { name: '🐦 Boids', load: () => import('/demos/boidsScene/boidsScene.js').then((m) => m.BoidsScene) },
      { name: '🚗 Car', load: () => import('/demos/carScene/carScene.js').then((m) => m.CarScene) },
      { name: '💧 Water & Boxes', load: () => import('/demos/waterAndBoxesScene/waterAndBoxesScene.js').then((m) => m.WaterAndBoxesScene) },
      { name: '🔬 Zenithal Particles', load: () => import('/demos/zenithalParticleTestScene/zenithalParticleTestScene.js').then((m) => m.ZenithalParticleTestScene) },
      { name: '✨ Particle Lab', load: () => import('/demos/particleLabScene/particleLabScene.js').then((m) => m.ParticleLabScene) },
      { name: 'Bunny Mark', load: () => import('/demos/bunnyMarkScene/bunnyMarkScene.js').then((m) => m.BunnyMarkScene) },
      { name: '🦴 Adobe Animate', load: () => import('/demos/adobeAnimateScene/adobeAnimateScene.js').then((m) => m.AdobeAnimateScene) },
      { name: 'platformer game', load: () => import('/demos/platformerGameScene/platformerGameScene.js').then((m) => m.PlatformerGameScene) },
      { name: 'Constraint Boxes', load: () => import('/demos/constraintBoxScene/constraintBoxScene.js').then((m) => m.ConstraintBoxScene) },
      { name: 'Oriented Boxes', load: () => import('/demos/orientedBoxScene/orientedBoxScene.js').then((m) => m.OrientedBoxScene) },
      { name: 'Weld Break', load: () => import('/demos/weldBreakScene/weldBreakScene.js').then((m) => m.WeldBreakScene) },
      { name: 'Box2D QueryAABB', load: () => import('/demos/box2dQueryAabbScene/box2dQueryAabbScene.js').then((m) => m.Box2dQueryAabbScene) },
      { name: '🐷 Bad Piggies', load: () => import('/demos/badPiggiesScene/badPiggiesScene.js').then((m) => m.BadPiggiesScene) },
      { name: '🌊 LiquidFun Fluid', load: () => import('/demos/liquidFunDemoScene/liquidFunDemoScene.js').then((m) => m.LiquidFunDemoScene) },
      { name: '🧪 LiquidFun Stress (bench)', load: () => import('/tests/bench/stressScenes/liquidFunStressScene.js').then((m) => m.LiquidFunStressScene) },
      { name: '🧱 Mamushka Dig', load: () => import('/demos/mamushkaDigScene/mamushkaDigScene.js').then((m) => m.MamushkaDigScene) },
      { name: '🔥 Burning Boxes', load: () => import('/demos/burningBoxesScene/burningBoxesScene.js').then((m) => m.BurningBoxesScene) },
      { name: '⛰️ Destructible Terrain', load: () => import('/demos/destructibleTerrainScene/destructibleTerrainScene.js').then((m) => m.DestructibleTerrainScene) },
    ];

    async function startScene(entry) {
      if (!entry.class) entry.class = await entry.load();
      document.getElementById('scene_list').style.display = 'none';
      await game.loadScene(entry.class);
    }

    if (game.debugUI) {
      game.debugUI.registerScenes(scenes);
    }

    for (let i = 0; i < scenes.length; i++) {
      const scene = scenes[i];
      const button = document.createElement('button');
      button.className = 'scene_chooser_button';
      button.onclick = () => startScene(scene);
      button.textContent = scene.name;
      document.getElementById('scene_list').appendChild(button);
      if (i % 2 == 1) document.getElementById('scene_list').appendChild(document.createElement('br'));
    }
  </script>
</body>
</html>
